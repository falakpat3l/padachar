name: Build pre-release APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag"
        required: true
        default: "v0.1.0-alpha"
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and debug APK
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Show compile errors as annotations
        if: failure()
        shell: bash
        run: |
          grep -E "^e: |error:|FAILED|What went wrong" -A2 build.log | head -40 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - name: Publish pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="StrideLocal-${TAG}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          NOTES="Pre-release build for testing. Offline only: no internet permission. Signed with a debug key, so uninstall the old version before installing a new one."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --prerelease --title "StrideLocal ${TAG}" --notes "$NOTES" --target "$GITHUB_SHA"
          fi
